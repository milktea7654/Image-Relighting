[project]
name = "scene-reconstruction"
version = "0.1.0"
description = "MoGe-2 + Ouroboros scene reconstruction pipeline"
requires-python = ">=3.10,<3.11"
dependencies = [
    # ── MoGe-2 CLI / app / Python API ──
    "moge",
    "click>=8.0.0",
    "gradio>=4.0.0",

    # ── PyTorch CUDA wheels; resolved by [tool.uv.sources] below ──
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torchaudio>=2.5.0",

    # ── MoGe / mesh / geometry deps ──
    # IMPORTANT: do not pin utils3d here. MoGe pins its own utils3d git revision.
    # Adding another utils3d git URL causes uv's "conflicting URLs" error.
    "huggingface-hub>=0.23.0",
    "opencv-python>=4.9.0",
    "matplotlib>=3.10.0",
    "numpy>=1.26.0,<2.0",
    "scipy>=1.13.0",
    "pillow>=10.3.0",
    "trimesh>=4.3.0",
    "pyglet>=2.0.0",
    "xatlas>=0.0.11",

    # ── Ouroboros / diffusion / training deps ──
    "pandas>=2.2.0",
    "scikit-image>=0.22.0",
    "imageio>=2.34.0",
    "transformers>=4.40.0",
    "diffusers>=0.27.0",
    "accelerate>=0.30.0",
    "datasets>=2.19.0",
    "peft>=0.10.0",
    "safetensors>=0.4.3",
    "tokenizers>=0.19.0",
    "lpips>=0.1.4",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "gradio-client>=1.0.0",
    "packaging>=24.0",
    "pydantic>=2.7.0",
    "typing-extensions>=4.11.0",
    "wandb>=0.17.0",
    "gitpython>=3.1.43",
    "h5py>=3.11.0",
]

[tool.uv]
package = false

# CUDA 12.4 PyTorch wheels for Windows.
# Keep torch packages explicit so only these packages come from the PyTorch index.
[tool.uv.sources]
moge = { git = "https://github.com/microsoft/MoGe.git" }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
